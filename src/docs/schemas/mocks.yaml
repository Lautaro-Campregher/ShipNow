components:
  schemas:
    SeedResult:
      type: object
      properties:
        insertados:
          type: object
          properties:
            usuarios:
              type: integer
              example: 15
            clientes:
              type: integer
              example: 10
            repartidores:
              type: integer
              example: 5
            pedidos:
              type: integer
              example: 10
            entregas:
              type: integer
              example: 10

    SeedResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - success
          example: success
        payload:
          $ref: "#/components/schemas/SeedResult"
