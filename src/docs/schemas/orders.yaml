components:
  schemas:
    Order:
      type: object
      properties:
        _id:
          type: string
        customer:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        deliveryAddress:
          type: string
        total:
          type: number
        shippingCost:
          type: number
        declaredValue:
          type: number
        status:
          type: string
          example: created
        priority:
          type: string
          example: normal
        delivery:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    OrderItem:
      type: object
      required:
        - name
        - quantity
        - price
      properties:
        name:
          type: string
          example: Auriculares inalámbricos
        quantity:
          type: integer
          example: 2
        price:
          type: number
          example: 15000

    OrderCreateInput:
      type: object
      required:
        - customer
        - items
        - deliveryAddress
      properties:
        customer:
          type: string
          example: 672a1b2c3d4e5f6789012345
        items:
          type: array
          description: Lista de productos incluidos en el pedido
          items:
            $ref: "#/components/schemas/OrderItem"
          example:
            - name: Auriculares inalámbricos
              quantity: 2
              price: 15000
        deliveryAddress:
          type: string
          example: "Av. Colón 123, Córdoba"

    OrderUpdateInput:
      type: object
      properties:
        customer:
          type: string
          example: 672a1b2c3d4e5f6789012345
        items:
          type: array
          description: Lista de productos incluidos en el pedido
          items:
            $ref: "#/components/schemas/OrderItem"
          example:
            - name: Auriculares inalámbricos
              quantity: 2
              price: 15000
        deliveryAddress:
          type: string
          example: Av. Colón 123, Córdoba
        total:
          type: number
          example: 30000
        shippingCost:
          type: number
          example: 1000
        declaredValue:
          type: number
          example: 30000
        status:
          type: string
          enum:
            - created
            - assigned
            - picked_up
            - in_transit
            - delivered
            - cancelled
          example: created
        priority:
          type: string
          enum:
            - low
            - normal
            - high
          example: normal
        delivery:
          type: string
          nullable: true
          example: 672a1b2c3d4e5f6789012345
