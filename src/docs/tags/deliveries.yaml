paths:
  /api/deliveries:
    get:
      tags:
        - Deliveries
      summary: Listar todas las entregas
      responses:
        "200":
          description: Listado de entregas obtenido correctamente
          content:
            application/json:
              example:
                status: success
                payload:
                  - _id: 672a1b2c3d4e5f6789012345
                    order: 672a1b2c3d4e5f6789012346
                    driver: 672a1b2c3d4e5f6789012347
                    status: pending
                    priority: normal
                    assignedAt: null
                    deliveredAt: null
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      tags:
        - Deliveries
      summary: Crear una entrega
      description: Crea una entrega asociada a un pedido existente. El repartidor es opcional.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryCreateInput"
            example:
              order: "672a1b2c3d4e5f6789012346"
              driver: "672a1b2c3d4e5f6789012347"
              status: pending
              priority: normal
      responses:
        "201":
          description: Entrega creada correctamente
          content:
            application/json:
              example:
                status: success
                payload:
                  _id: 672a1b2c3d4e5f6789012345
                  order: 672a1b2c3d4e5f6789012346
                  driver: 672a1b2c3d4e5f6789012347
                  status: pending
                  priority: normal
                  assignedAt: null
                  deliveredAt: null
        "400":
          description: Datos inválidos o referencias inexistentes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                orderNotFound:
                  summary: El pedido no existe
                  value:
                    status: error
                    message: El pedido especificado no existe
                    code: ORDER_NOT_FOUND
                driverInvalid:
                  summary: El repartidor no existe o no tiene el rol correcto
                  value:
                    status: error
                    message: El repartidor especificado no existe o no tiene el rol correcto
                    code: DELIVERY_DRIVER_INVALID
                validationError:
                  summary: Error de validación
                  value:
                    status: error
                    message: Los datos enviados no son válidos
                    code: VALIDATION_ERROR
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/deliveries/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
        description: Identificador de la entrega

    get:
      tags:
        - Deliveries
      summary: Obtener una entrega por ID
      responses:
        "200":
          description: Entrega obtenida correctamente
          content:
            application/json:
              example:
                status: success
                payload:
                  _id: 672a1b2c3d4e5f6789012345
                  order: 672a1b2c3d4e5f6789012346
                  driver: null
                  status: pending
                  priority: normal
                  assignedAt: null
                  deliveredAt: null
        "400":
          description: ID inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                message: El ID proporcionado no es válido
                code: INVALID_ID
        "404":
          description: Entrega no encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                message: Entrega no encontrada
                code: DELIVERY_NOT_FOUND
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    put:
      tags:
        - Deliveries
      summary: Actualizar una entrega
      description: Permite actualizar parcialmente los datos de una entrega.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryUpdateInput"
            example:
              driver: "672a1b2c3d4e5f6789012347"
              status: assigned
              priority: high
      responses:
        "200":
          description: Entrega actualizada correctamente
          content:
            application/json:
              example:
                status: success
                payload:
                  _id: 672a1b2c3d4e5f6789012345
                  order: 672a1b2c3d4e5f6789012346
                  driver: 672a1b2c3d4e5f6789012347
                  status: assigned
                  priority: high
        "400":
          description: Datos inválidos o referencias inexistentes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidId:
                  summary: ID inválido
                  value:
                    status: error
                    message: El ID proporcionado no es válido
                    code: INVALID_ID
                orderNotFound:
                  summary: El pedido no existe
                  value:
                    status: error
                    message: El pedido especificado no existe
                    code: DELIVERY_ORDER_NOT_FOUND
                driverInvalid:
                  summary: Repartidor inválido
                  value:
                    status: error
                    message: El repartidor especificado no existe o no tiene el rol correcto
                    code: DELIVERY_DRIVER_INVALID
                validationError:
                  summary: Error de validación
                  value:
                    status: error
                    message: Los datos enviados no son válidos
                    code: VALIDATION_ERROR
        "404":
          description: Entrega no encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                message: Entrega no encontrada
                code: DELIVERY_NOT_FOUND
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      tags:
        - Deliveries
      summary: Eliminar una entrega
      responses:
        "200":
          description: Entrega eliminada correctamente
          content:
            application/json:
              example:
                status: success
                message: Entrega eliminada
        "400":
          description: ID inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                message: El ID proporcionado no es válido
                code: INVALID_ID
        "404":
          description: Entrega no encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                message: Entrega no encontrada
                code: DELIVERY_NOT_FOUND
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
