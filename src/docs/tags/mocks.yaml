/api/mocks/users:
  get:
    tags:
      - Mocks
    description: >
      Genera usuarios clientes, repartidores, pedidos y entregas
      relacionados entre sí.
    summary: Generar usuarios de prueba
    parameters:
      - in: query
        name: qty
        required: false
        description: Cantidad de usuarios a generar.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 2
    responses:
      "200":
        description: Usuarios generados correctamente
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  example: success
                payload:
                  type: array
                  items:
                    $ref: "#/components/schemas/User"
      "400":
        description: Cantidad solicitada no válida
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"
            examples:
              invalidQuantity:
                summary: Cantidad inválida
                value:
                  status: error
                  message: La cantidad solicitada para los mocks no es válida
                  code: INVALID_MOCK_QUANTITY
      "500":
        description: Error interno del servidor
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"
            examples:
              internalServerError:
                summary: Error interno
                value:
                  status: error
                  message: Error interno del servidor
                  code: INTERNAL_SERVER_ERROR

