paths:
  /api/mocks/users:
    get:
      tags:
        - Mocks
      summary: Generar usuarios de prueba
      description: Genera usuarios clientes, repartidores, pedidos y entregas relacionados entre sí.
      parameters:
        - in: query
          name: qty
          required: false
          description: Cantidad de usuarios a generar.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 2
      responses:
        "200":
          description: Usuarios generados correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
              example:
                status: success
                payload:
                  - _id: "672a1b2c3d4e5f6789012345"
                    firstName: Lautaro
                    lastName: Campregher
                    email: lautaro@example.com
                    role: customer
        "400":
          description: Cantidad solicitada no válida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                message: La cantidad solicitada para los mocks no es válida
                code: INVALID_MOCK_QUANTITY
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                message: Error interno del servidor
                code: INTERNAL_SERVER_ERROR

  /api/mocks/drivers:
    get:
      tags:
        - Mocks
      summary: Generar repartidores de prueba
      parameters:
        - in: query
          name: qty
          required: false
          description: Cantidad de repartidores a generar.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 2
      responses:
        "200":
          description: Repartidores generados correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
              example:
                status: success
                payload:
                  - _id: "672a1b2c3d4e5f6789012347"
                    firstName: Juan
                    lastName: Pérez
                    email: juan@example.com
                    role: driver
        "400":
          description: Cantidad solicitada no válida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                message: La cantidad solicitada para los mocks no es válida
                code: INVALID_MOCK_QUANTITY
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                message: Error interno del servidor
                code: INTERNAL_SERVER_ERROR

  /api/mocks/orders:
    get:
      tags:
        - Mocks
      summary: Generar pedidos de prueba
      parameters:
        - in: query
          name: qty
          required: false
          description: Cantidad de pedidos a generar.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 2
      responses:
        "200":
          description: Pedidos generados correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
              example:
                status: success
                payload:
                  - _id: "672a1b2c3d4e5f6789012348"
                    customer: "672a1b2c3d4e5f6789012345"
                    items:
                      - name: Auriculares inalámbricos
                        quantity: 2
                        price: 15000
                    deliveryAddress: "Av. Colón 123, Córdoba"
                    total: 30000
                    shippingCost: 1000
                    declaredValue: 30000
                    status: created
                    priority: normal
                    delivery: null
        "400":
          description: Cantidad solicitada no válida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                message: La cantidad solicitada para los mocks no es válida
                code: INVALID_MOCK_QUANTITY
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                message: Error interno del servidor
                code: INTERNAL_SERVER_ERROR

  /api/mocks/deliveries:
    get:
      tags:
        - Mocks
      summary: Generar entregas de prueba
      parameters:
        - in: query
          name: qty
          required: false
          description: Cantidad de entregas a generar.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 2
      responses:
        "200":
          description: Entregas generadas correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
              example:
                status: success
                payload:
                  - _id: "672a1b2c3d4e5f6789012349"
                    order: "672a1b2c3d4e5f6789012348"
                    driver: "672a1b2c3d4e5f6789012347"
                    status: pending
                    priority: normal
                    assignedAt: null
                    deliveredAt: null
        "400":
          description: Cantidad solicitada no válida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                message: La cantidad solicitada para los mocks no es válida
                code: INVALID_MOCK_QUANTITY
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                message: Error interno del servidor
                code: INTERNAL_SERVER_ERROR

  /api/mocks/dataset:
    get:
      tags:
        - Mocks
      summary: Generar conjunto de datos relacionados
      description: Genera usuarios, repartidores, pedidos y entregas relacionados entre sí.
      parameters:
        - in: query
          name: qty
          required: false
          description: Cantidad base de clientes y pedidos a generar.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 2
      responses:
        "200":
          description: Conjunto de datos generado correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
              example:
                status: success
                payload:
                  users:
                    - _id: "672a1b2c3d4e5f6789012345"
                      firstName: Lautaro
                      lastName: Campregher
                      email: lautaro@example.com
                      role: customer
                  drivers:
                    - _id: "672a1b2c3d4e5f6789012347"
                      firstName: Juan
                      lastName: Pérez
                      email: juan@example.com
                      role: driver
                  orders:
                    - _id: "672a1b2c3d4e5f6789012348"
                      customer: "672a1b2c3d4e5f6789012345"
                      items:
                        - name: Auriculares inalámbricos
                          quantity: 2
                          price: 15000
                      deliveryAddress: "Av. Colón 123, Córdoba"
                      total: 30000
                      shippingCost: 1000
                      declaredValue: 30000
                      status: created
                      priority: normal
                      delivery: null
                  deliveries:
                    - _id: "672a1b2c3d4e5f6789012349"
                      order: "672a1b2c3d4e5f6789012348"
                      driver: "672a1b2c3d4e5f6789012347"
                      status: pending
                      priority: normal
                      assignedAt: null
                      deliveredAt: null
        "400":
          description: Cantidad solicitada no válida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                message: La cantidad solicitada para los mocks no es válida
                code: INVALID_MOCK_QUANTITY
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                message: Error interno del servidor
                code: INTERNAL_SERVER_ERROR

  /api/mocks/seed:
    post:
      tags:
        - Mocks
      summary: Generar datos de prueba relacionados
      description: >
        Genera usuarios clientes, repartidores, pedidos y entregas
        relacionados entre sí.
      parameters:
        - in: query
          name: qty
          required: false
          description: Cantidad de clientes y pedidos a generar. Se generan además repartidores.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 2
      responses:
        "201":
          description: Datos de prueba generados correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeedResponse"
              example:
                status: success
                payload:
                  insertados:
                    usuarios: 15
                    clientes: 10
                    repartidores: 5
                    pedidos: 10
                    entregas: 10
        "400":
          description: Cantidad de datos solicitada no válida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                message: La cantidad solicitada para los mocks no es válida
                code: INVALID_MOCK_QUANTITY
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                message: Error interno del servidor
                code: INTERNAL_SERVER_ERROR
