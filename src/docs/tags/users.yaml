paths:
  /api/users:
    get:
      tags:
        - Users
      summary: Listar usuarios
      responses:
        "200":
          description: Lista de usuarios obtenida correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
              example:
                status: success
                payload:
                  - _id: "6aecc6815c2dfd2bc200fc98"
                    firstName: Lautaro
                    lastName: Campos
                    email: lautaro@example.com
                    role: customer
                    documents: []

        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                internalServerError:
                  summary: Error interno
                  value:
                    status: error
                    message: Error interno del servidor
                    code: INTERNAL_SERVER_ERROR

    post:
      tags:
        - Users
      summary: Crear usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreateInput"
      responses:
        "201":
          description: Usuario creado correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Datos enviados no válidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                validationError:
                  summary: Datos inválidos
                  value:
                    status: error
                    message: Los datos enviados no son válidos
                    code: VALIDATION_ERROR
        "409":
          description: El email ya se encuentra registrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                duplicateEmail:
                  summary: Email duplicado
                  value:
                    status: error
                    message: Este email ya se encuentra registrado
                    code: USER_EMAIL_ALREADY_EXISTS
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                internalServerError:
                  summary: Error interno
                  value:
                    status: error
                    message: Error interno del servidor
                    code: INTERNAL_SERVER_ERROR

  /api/users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Identificador del usuario
        schema:
          type: string

    get:
      tags:
        - Users
      summary: Obtener usuario por ID
      responses:
        "200":
          description: Usuario obtenido correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: ID inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidId:
                  summary: ID inválido
                  value:
                    status: error
                    message: El ID proporcionado no es válido
                    code: INVALID_ID
        "404":
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                userNotFound:
                  summary: Usuario inexistente
                  value:
                    status: error
                    message: Usuario no encontrado
                    code: USER_NOT_FOUND
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                internalServerError:
                  summary: Error interno
                  value:
                    status: error
                    message: Error interno del servidor
                    code: INTERNAL_SERVER_ERROR

    put:
      tags:
        - Users
      summary: Actualizar usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdateInput"
      responses:
        "200":
          description: Usuario actualizado correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: ID o datos enviados no válidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidId:
                  summary: ID inválido
                  value:
                    status: error
                    message: El ID proporcionado no es válido
                    code: INVALID_ID
                validationError:
                  summary: Datos inválidos
                  value:
                    status: error
                    message: Los datos enviados no son válidos
                    code: VALIDATION_ERROR
        "404":
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                userNotFound:
                  summary: Usuario inexistente
                  value:
                    status: error
                    message: Usuario no encontrado
                    code: USER_NOT_FOUND
        "409":
          description: El email ya se encuentra registrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                duplicateEmail:
                  summary: Email duplicado
                  value:
                    status: error
                    message: Este email ya se encuentra registrado
                    code: USER_EMAIL_ALREADY_EXISTS
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                internalServerError:
                  summary: Error interno
                  value:
                    status: error
                    message: Error interno del servidor
                    code: INTERNAL_SERVER_ERROR

    delete:
      tags:
        - Users
      summary: Eliminar usuario
      responses:
        "200":
          description: Usuario eliminado correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
              examples:
                success:
                  summary: Usuario eliminado
                  value:
                    status: success
                    message: Usuario eliminado
        "400":
          description: ID inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidId:
                  summary: ID inválido
                  value:
                    status: error
                    message: El ID proporcionado no es válido
                    code: INVALID_ID
        "404":
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                userNotFound:
                  summary: Usuario inexistente
                  value:
                    status: error
                    message: Usuario no encontrado
                    code: USER_NOT_FOUND
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                internalServerError:
                  summary: Error interno
                  value:
                    status: error
                    message: Error interno del servidor
                    code: INTERNAL_SERVER_ERROR

  /api/users/{uid}/documents:
    post:
      tags:
        - Users
      summary: Subir documento de usuario
      description: Permite subir un documento asociado a un usuario.
      parameters:
        - name: uid
          in: path
          required: true
          description: Identificador del usuario
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
                - type
              properties:
                file:
                  type: string
                  format: binary
                  description: Archivo del documento
                type:
                  type: string
                  enum:
                    - identity
                    - address
                    - other
                  description: Tipo de documento
                  example: identity
      responses:
        "200":
          description: Documento subido correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

        "400":
          description: Archivo inválido o datos incorrectos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                fileRequired:
                  summary: Archivo obligatorio
                  value:
                    status: error
                    message: Debe adjuntar un archivo
                    code: FILE_REQUIRED
                invalidFileType:
                  summary: Tipo de archivo no permitido
                  value:
                    status: error
                    message: El tipo de archivo no está permitido
                    code: INVALID_FILE_TYPE
                fileTooLarge:
                  summary: Archivo demasiado grande
                  value:
                    status: error
                    message: El archivo supera el tamaño máximo permitido de 5 MB
                    code: FILE_TOO_LARGE
                uploadError:
                  summary: Error al procesar el archivo
                  value:
                    status: error
                    message: Error al procesar la carga del archivo
                    code: UPLOAD_ERROR
                invalidDocumentType:
                  summary: Tipo de documento inválido
                  value:
                    status: error
                    message: El tipo de documento no es válido
                    code: INVALID_DOCUMENT_TYPE
        "404":
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/users/{uid}/licenses:
    post:
      tags:
        - Users
      summary: Subir licencia de conducir
      description: Permite subir una licencia de conducir asociada a un usuario.
      parameters:
        - name: uid
          in: path
          required: true
          description: Identificador del usuario
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
                - type
              properties:
                file:
                  type: string
                  format: binary
                  description: Archivo de la licencia de conducir
                type:
                  type: string
                  description: Tipo de licencia
                  example: driver_license

      responses:
        "200":
          description: Licencia subida correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Archivo inválido o datos incorrectos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                fileRequired:
                  summary: Archivo obligatorio
                  value:
                    status: error
                    message: Debe adjuntar un archivo
                    code: FILE_REQUIRED
                invalidFileType:
                  summary: Tipo de archivo no permitido
                  value:
                    status: error
                    message: El tipo de archivo no está permitido
                    code: INVALID_FILE_TYPE
                fileTooLarge:
                  summary: Archivo demasiado grande
                  value:
                    status: error
                    message: El archivo supera el tamaño máximo permitido de 5 MB
                    code: FILE_TOO_LARGE
                uploadError:
                  summary: Error al procesar el archivo
                  value:
                    status: error
                    message: Error al procesar la carga del archivo
                    code: UPLOAD_ERROR
        "404":
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                userNotFound:
                  summary: Usuario inexistente
                  value:
                    status: error
                    message: Usuario no encontrado
                    code: USER_NOT_FOUND
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                databaseError:
                  summary: Error de base de datos
                  value:
                    status: error
                    message: Error al acceder a la base de datos
                    code: DATABASE_ERROR
                internalServerError:
                  summary: Error interno
                  value:
                    status: error
                    message: Error interno del servidor
                    code: INTERNAL_SERVER_ERROR
